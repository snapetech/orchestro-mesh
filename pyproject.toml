[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orchestro-mesh"
version = "0.1.0"
description = "Private trusted inference mesh and capability market for Orchestro."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Keith Snape" }]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn[standard]>=0.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10"
]

[project.scripts]
orchestro-mesh = "orchestro_mesh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestro_mesh"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
