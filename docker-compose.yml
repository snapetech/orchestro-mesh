services:
  gateway:
    build: .
    command: uvicorn orchestro_mesh.gateway:app --host 0.0.0.0 --port 8765
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./.orchestro-mesh:/app/.orchestro-mesh
      - ./mesh.yaml:/app/mesh.yaml:ro
    environment:
      ORCHESTRO_MESH_CONFIG: /app/mesh.yaml
